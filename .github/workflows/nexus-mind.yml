name: NEXUS Mind

on:
  push:
    paths: ['nexus-mind/**', '.github/workflows/nexus-mind.yml']
  pull_request:
    paths: ['nexus-mind/**', '.github/workflows/nexus-mind.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: nexus-mind

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-mind/package-lock.json
      # Tests use node:sqlite, so native Electron deps are not needed here.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  package:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-mind/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned builds by default; add CSC_LINK / APPLE_ID secrets to sign and notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-mind-${{ matrix.os }}
          path: |
            nexus-mind/release/*/*.exe
            nexus-mind/release/*/*.dmg
            nexus-mind/release/*/*.AppImage
            nexus-mind/release/*/*.deb
